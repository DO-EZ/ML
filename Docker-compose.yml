version: "3"

services:
  mlflow:
    build: ./mlflow-image
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    restart: unless-stopped

  trainer:
    build:
      context: .
      dockerfile: auto_run/Dockerfile
    container_name: mlflow-trainer
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    volumes:
      - .:/app
      - ./logs:/app/logs
    restart: unless-stopped
